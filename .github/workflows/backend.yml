# 6.5 · lint + the full suite against a real Postgres, on every push and PR.
# The DB suites need the scraper's public.* tables; CI seeds them from a
# schema-only dump (scripts/kse_public_schema.sql), then applies our migrations.
name: backend
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/kse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # The scraper's tables (schema only), then our migrations, then the suite.
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/kse_public_schema.sql
      - run: npm run migrate
      - run: npm run verify
